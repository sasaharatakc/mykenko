name: "✨ Feature"
description: 新機能の追加・改善
title: "[Feature] "
labels: ["type:feature", "status:todo"]
body:
  - type: textarea
    id: goal
    attributes:
      label: 目的
      description: 何を達成したいですか？ユーザーへの価値は何ですか？
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 作業範囲
      description: どこまで作りますか？何は含まない？
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 優先度
      description: S=売上/法規制直結 / A=今週 / B=余裕あれば / C=いつか
      options:
        - "S — 売上・法規制・重大バグに直結"
        - "A — 今週やる"
        - "B — 余裕があれば"
        - "C — いつか"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 対象エリア
      options:
        - media
        - shop
        - ai
        - price-monitor
        - admin
        - infra
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 完了条件
      description: 何ができたら完了？具体的に書いてください。
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: 補足・参考リンク
      description: Figmaリンク、参考サイト、関連Issueなど
    validations:
      required: false
